

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PHP Radio Button Example</title>
</head>
<body>

    <!-- The form submits back to the same page -->
    <form action="process.php" method="POST">
        <p><strong>How would you like us to contact you?</strong></p>
        
        <!-- Both inputs share the name 'contact_method' -->
        <input type="radio" id="email" name="contact_method" value="Detroit">
        <label for="email">Detroit</label><br>

        <input type="radio" id="phone" name="contact_method" value="Chicago">
        <label for="phone	">Chicago</label><br>
        
        <input type="radio" id="email" name="contact_method" value="Miami">
        <label for="email">Miami</label><br>

        <input type="radio" id="phone" name="contact_method" value="New York">
        <label for="phone	">New York</label><br>


        <br>
        <button type="submit">Submit</button>
    </form>

</body>
</html>
